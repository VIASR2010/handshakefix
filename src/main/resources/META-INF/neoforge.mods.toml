[[mods]]
modId="handshakefix"
version="1.1.0"
displayName="HandshakeFix / 握手修复"
displayURL="https://github.com/VIASR/handshakefix"
authors="VIS33552 (VIASR)"
description='''
客户端专用。

把本客户端所有 mod 的网络通道在协商阶段降级为 optional：
服务端少装某个 mod 时只禁用对应通道，不会再踢人下线，
也就不会再出现“客户端不兼容！请使用 NeoForge …”那个界面。

服务端没有的通道会被自动禁用，这些 mod 发出的包会被静默丢弃
（不会触发服务端的 “No Channel for …” 断开）。

装客户端即可，服务端不需要装，也不会影响服务端。
'''

[[dependencies."handshakefix"]]
modId="neoforge"
type="required"
versionRange="[26,)"
ordering="NONE"
side="CLIENT"

